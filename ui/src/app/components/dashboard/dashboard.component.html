<div class="dashboard">
  <!-- Error Alert -->
  @if (error(); as errorMessage) {
    <div class="alert alert-danger">
      <div class="alert-content">
        <span class="alert-message">{{ errorMessage }}</span>
        <button class="alert-close" (click)="dismissError()" type="button">
          ×
        </button>
      </div>
    </div>
  }

  <!-- Status Section -->
  <app-status-card
    [status]="status()"
    [isLoading]="isLoadingStatus()"
    (disconnectAll)="onDisconnectAll()"
    (refresh)="onRefresh()">
  </app-status-card>

  <!-- Connections Section -->
  <app-connection-list
    [connections]="connections()"
    [isLoading]="isLoadingConnections()"
    (connect)="onConnect($event)"
    (disconnect)="onDisconnect($event)"
    (refresh)="onRefresh()">
  </app-connection-list>
</div>
